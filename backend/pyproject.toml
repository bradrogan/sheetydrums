[project]
name = "sheetydrums"
version = "0.1.0"
description = "Audio-to-drum-sheet-music backend pipeline"
authors = [
    { name = "Brad Rogan", email = "brad.rogan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "adtof-pytorch",
    "audio-separator[silicon]>=0.44.2",
    "beat-this>=1.1.0",
    "demucs>=4.0.1",
    "fastapi>=0.115.0",
    "jsonschema>=4.26.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.26.0",
    "python-multipart>=0.0.20",
    "scipy>=1.17.1",
    "soundfile>=0.13.1",
    "typer>=0.25.1",
    "uvicorn>=0.32.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
sheetydrums = "sheetydrums:main"
sheetydrums-serve = "sheetydrums.server:main_serve"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# typer / soundfile / scipy / demucs / torch all have weak type stubs that
# leak Unknown/Any across our function boundaries. Disabling the related
# rules keeps strict mode on for code we control while not chasing noise
# from third-party stub gaps. Re-evaluate if Any starts polluting our own
# returns or attribute access patterns.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

# `reportPrivateUsage` flags reads of `_name` from outside the declaring
# module/class. That rule protects an API boundary from its *consumers*, and the
# test suite sits inside the boundary: these tests monkeypatch module globals
# (`store._store_dir`, `server._jobs`) and assert on concrete stage internals
# (`_thresholds`, `_model_name`) precisely because that is what they are testing.
# Turned off for `tests` only — `src` keeps it, and every other strict rule still
# applies to both trees.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[[tool.pyright.executionEnvironments]]
root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: integration tests that load real models / fixtures (run with --run-slow)",
]
# Silence the same third-party rotary-embedding-torch FutureWarning in the test
# summary (see sheetydrums/__init__.py). Tightly scoped to that message.
filterwarnings = [
    "ignore:.*torch.cuda.amp.autocast.*is deprecated:FutureWarning",
]

[tool.uv.sources]
adtof-pytorch = { git = "https://github.com/xavriley/ADTOF-pytorch.git" }
